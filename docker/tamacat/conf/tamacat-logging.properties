# tamacat-logging configuration. It is read from the classpath (/app/conf).
# Output goes to stdout only. Details: https://github.com/tamacat/tamacat-logging
#
# format: text | json (ECS JSON Lines). The environment variable
# TAMACAT_LOG_FORMAT overrides it, e.g. TAMACAT_LOG_FORMAT=json.
format=text
pattern=%d [%thread] [%level] %logger{40} - %msg%labels%n%ex

level.root=WARN
level.Access=INFO
level.org.tamacat=INFO
level.org=INFO
level.com=INFO
