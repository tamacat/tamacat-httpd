# hadolint configuration for docker/tamacat/Dockerfile
# Invocation (advisory only; no CI workflow runs it), from the repository root:
#   docker run --rm -i -v "$PWD/docker/tamacat/.hadolint.yaml:/.hadolint.yaml:ro" \
#     hadolint/hadolint hadolint --config /.hadolint.yaml - < docker/tamacat/Dockerfile
# The configuration file has to be mounted and named: piping the Dockerfile
# alone into the container does not apply it, and DL3041 is then reported.
#
# DL3041 (pin dnf package versions) is accepted, not ignored: `binutils`
# is installed in the discarded `builder` stage only (never reaches the
# shipped image) purely to provide `objcopy` for `jlink --strip-debug`;
# pinning an exact Amazon Linux 2023 binutils build number would add
# fragility for a build-time-only, non-security-relevant tool.
ignored:
  - DL3041
