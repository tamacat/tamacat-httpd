# 依存の自動更新（dependency-auto-update-tool）を毎日実行する。
#
# .github/dependency-auto-update/tool.properties の branch.<name>.expectedJdkMajor に書いたブランチごとに、
# そのブランチの JDK で更新候補を `mvn clean verify` で確かめ、通ったものを
# dependency-auto-update/<branch> から PR にする（既にあれば更新する）。自動マージはしない。
# 処理の中身は呼び出し先のワークフローを参照:
# https://github.com/tamacat/dependency-auto-update-tool/blob/main/.github/workflows/dependency-auto-update.yml
#
# 補足:
# - GITHUB_TOKEN で作った PR では、CodeQL などの他のワークフローは自動では動かない。PR を一度閉じて開き直すと動く。
# - スケジュール実行は混雑時に数分〜数十分遅れることがある。
# - 公開リポジトリでは、60 日間コミットがないとスケジュール実行が止まる。Actions タブから再開できる。

name: Dependency auto-update

on:
  schedule:
    - cron: '0 11 * * *' # 毎日 20:00（日本時間。cron は UTC）
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-auto-update
  cancel-in-progress: false

jobs:
  update:
    # 呼び出すワークフローはコミットの SHA で固定する
    uses: tamacat/dependency-auto-update-tool/.github/workflows/dependency-auto-update.yml@97759e1d1493c4252191d9b7f8700a67fc41e3c6 # tamacat/dependency-auto-update-tool#15
    permissions:
      contents: write # PR 用ブランチの push（ビルドを動かすジョブは読み取りだけで動く）
      pull-requests: write # PR の作成・更新
    with:
      tool-version: v0.3.1 # 使うツールの Release のタグ
