# tamacat-logging configuration for the tests (stdout only).
format=text
# %labels prints the MDC entries (ip, user) that AccessLogUtils sets.
pattern=%d [%thread] [%level] %logger{40} - %msg%labels%n%ex

level.root=WARN
level.Access=INFO
level.org.tamacat=DEBUG
level.org.tamacat.httpd.handler=INFO
# The wire and header logs of the HttpCore test server (httpcore4.testserver)
# are very verbose at DEBUG; they were silenced by commons-logging's NoOpLog.
level.org.tamacat.httpcore4=INFO
level.org.thymeleaf=OFF
level.org=INFO
level.com=INFO
