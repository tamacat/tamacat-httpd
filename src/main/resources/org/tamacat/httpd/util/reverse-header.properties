#
# Configuration of header for reverse proxy.
#

#Remove hop-by-hop request headers.
request.removeHeaders=Content-Length,Transfer-Encoding,Accept-Encoding,Connection,Keep-Alive,Proxy-Authenticate,Proxy-Authorization,TE,Trailers,Upgrade,Range

#Remove hop-by-hop response headers.
#
#Content-Type was in this list until 2.0-tc11 and must NOT be put back.
#It is an entity header, end-to-end, never hop-by-hop. Stripping it was
#harmless on the 1.5 line only because httpcore 4.4 put it straight back:
#ResponseContent added entity.getContentType() to the response when the
#header was absent. httpcore5's ResponseContent does not - it touches only
#Content-Length and Transfer-Encoding - so from the httpcore5 migration
#onwards the header was simply lost on every proxied response, taking
#GzipResponseInterceptor and HtmlLinkConvertInterceptor with it (both read
#Content-Type to decide whether to act).
#
#Content-Encoding stays listed on purpose: GzipResponseInterceptor sets it
#itself when it compresses.
response.removeHeaders=Content-Encoding,Content-Length,Transfer-Encoding,Connection,Keep-Alive,TE,Trailers,Upgrade,Content-MD5
